services:
  postgres:
    image: postgres:16-alpine
    container_name: english-a1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: english_a1
    ports:
      - "5432:5432"
    volumes:
      - english-a1-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  english-a1-pgdata:
